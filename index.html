<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mastery Hub Mathieu - 6ème</title>

<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

:root {

  --bg-main: #f4fbf7; --card-bg: #ffffff; --green-dark: #1b4332;

  --green-primary: #2d6a4f; --green-light: #d8f3dc; --green-soft: #e8f5e9;

  --violet-primary: #6d28d9; --gold-accent: #d97706; --gold-light: #fef3c7;

  --blue-info: #0284c7; --blue-light: #e0f2fe; --text-main: #132a13;

  --border: #b7e4c7; --font-family: 'Lexend', sans-serif;

}

body.dys-heavy { letter-spacing: 0.07em; word-spacing: 0.18em; line-height: 2.0; }

* { box-sizing: border-box; margin: 0; padding: 0; }

body { font-family: var(--font-family); background-color: var(--bg-main); color: var(--text-main); padding: 16px; line-height: 1.6; }

.container { max-width: 840px; margin: 0 auto; }

.card { background: var(--card-bg); border-radius: 14px; padding: 16px; border: 2px solid var(--border); margin-bottom: 14px; }

.sub-btn, .nav-btn, .len-btn { padding: 8px 12px; border-radius: 10px; border: 2px solid var(--border); background: #fff; font-weight: 800; cursor: pointer; color: var(--green-dark); font-size: 0.9rem; }

.sub-btn.active, .len-btn.active { background: var(--green-primary); color: #fff; border-color: var(--green-dark); }

.len-btn.active { background: var(--violet-primary); border-color: var(--violet-primary); }

.subject-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 12px; }

.quiz-card { background: #fff; border-radius: 12px; padding: 16px; border: 2px solid var(--border); margin-bottom: 14px; }

.answer-input { width: 100%; min-height: 65px; padding: 10px; border-radius: 8px; border: 2px solid #cbd5e1; font-family: inherit; font-size: 0.95rem; margin-top: 8px; }

.fb-box { margin-top: 10px; padding: 10px; border-radius: 8px; font-size: 0.9rem; display: none; }

.fb-success { background: var(--green-light); color: var(--green-dark); }

.fb-warning { background: #fff7ed; color: #9a3412; border: 1px solid #fdba74; }

.bilan-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }

.bilan-table th, .bilan-table td { border: 1px solid var(--border); padding: 8px; vertical-align: top; }

.bilan-table th { background: #edf7f0; color: var(--green-dark); text-align: left; }

.lesson-card { background: #fff; border-radius: 10px; border: 2px solid var(--border); margin-bottom: 8px; padding: 12px; }

</style>

</head>

<body>

<div class="container">

  <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">

    <div>

      <h1 style="color:var(--green-dark); font-size:1.2rem;">Mastery Hub Mathieu ⚽</h1>

      <p style="font-size:0.8rem; color:#555;">Entraînement intelligent & rigoureux</p>

    </div>

    <button class="nav-btn" onclick="document.body.classList.toggle('dys-heavy')">👓 Vue DYS</button>

  </div>



  <div class="subject-grid">

    <button class="sub-btn active" id="btn_hg" onclick="changeSubject('hg')">🏛️ Hist-Géo</button>

    <button class="sub-btn" id="btn_pc" onclick="changeSubject('pc')">🔥 Physique</button>

    <button class="sub-btn" id="btn_svt" onclick="changeSubject('svt')">🌱 SVT</button>

    <button class="sub-btn" id="btn_anglais" onclick="changeSubject('anglais')">🇬🇧 Anglais</button>

    <button class="sub-btn" id="btn_maths" onclick="changeSubject('maths')">📐 Maths</button>

  </div>



  <div class="card" id="filterBar">

    <div style="font-weight:800; font-size:0.85rem; color:var(--green-dark); margin-bottom:6px;">🎯 Leçons ciblées :</div>

    <div id="lessonChips" style="display:flex; flex-wrap:wrap; gap:6px;"></div>

  </div>



  <div style="display:flex; gap:8px; margin-bottom:12px;">

    <button class="nav-btn active" id="tabDevoir" onclick="switchTab('devoir')">📝 S'entraîner</button>

    <button class="nav-btn" id="tabCours" onclick="switchTab('cours')">📖 Fiches de cours</button>

  </div>



  <div id="viewDevoir">

    <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:10px 16px;">

      <span style="font-weight:800; font-size:0.9rem;">Nombre de questions :</span>

      <div style="display:flex; gap:4px;">

        <button class="len-btn active" onclick="setCount(3, this)">3</button>

        <button class="len-btn" onclick="setCount(5, this)">5</button>

        <button class="len-btn" onclick="setCount(10, this)">10</button>

      </div>

    </div>



    <div id="questionsContainer"></div>



    <div style="text-align:center; margin:16px 0;">

      <button class="sub-btn active" style="padding:12px 20px; font-size:1rem; background:var(--green-primary);" onclick="validerDevoir()">📊 Valider et voir mon bilan</button>

    </div>



    <div class="card" id="matchReport" style="display:none;">

      <h2 style="color:var(--green-dark); font-size:1.1rem; text-align:center;">🎮 Bilan de l'évaluation</h2>

      <div id="scoreFinal" style="font-size:1.4rem; font-weight:800; color:var(--green-dark); text-align:center; margin:8px 0;"></div>

      <div id="badgePalier" style="text-align:center; font-weight:700; margin-bottom:10px; font-size:0.95rem;"></div>

      <table class="bilan-table">

        <thead><tr><th>✅ Ce que je maîtrise bien</th><th>🔍 À revoir (Vocabulaire technique)</th></tr></thead>

        <tbody><tr><td id="cellAcquis"></td><td id="cellRevoir"></td></tr></tbody>

      </table>

    </div>

  </div>



  <div id="viewCours" style="display:none;"></div>

</div>



<script>

const COURS_DATA = {

  hg: {

    nom: "Histoire-Géo (Les débuts de l'humanité)",

    lecons: [

      { id: "hg_l1", titre: "I - Les 1ers humains & Fossiles" },

      { id: "hg_l2", titre: "II - Le peuplement & Nomades" },

      { id: "hg_l3", titre: "III - La vie au Paléolithique" }

    ],

    fiches: [

      { titre: "Fossiles & Préhistoire", contenu: "Les fossiles sont des traces de vie dans la roche. La Préhistoire s'achève avec l'écriture vers 3500 av. J.-C." },

      { titre: "Les Nomades", contenu: "Les nomades n'ont pas d'habitat fixe et se déplacent en suivant les animaux." },

      { titre: "Le Paléolithique", contenu: "C'est l'âge de la pierre taillée. Activités : cueillette, collecte, chasse et pêche." }

    ],

    questions: [

      { leconId: "hg_l1", titre: "Qu'est-ce qu'un fossile ? Explique leur utilité.", bareme: "4 pts", check: v => {

        const idee = v.includes('trace') || v.includes('passé') || v.includes('os') || v.includes('roche');

        const tech = v.includes('fossile');

        if (tech) return {pts:4, status:'ok', msg:"✅ Parfait ! (4/4)"};

        if (idee) return {pts:2, status:'partiel', msg:"⚠️ Bonne idée (2/4 pts). Mot attendu : <strong>fossiles</strong>."};

        return {pts:0, status:'faux', msg:"❌ Pense aux traces dans la roche."};

      }},

      { leconId: "hg_l2", titre: "D'où viennent les Homo Sapiens et qui appelle-t-on nomades ?", bareme: "4 pts", check: v => {

        const idee = v.includes('afrique') && (v.includes('fixe') || v.includes('boug') || v.includes('maison'));

        const tech = v.includes('nomade');

        if (tech && idee) return {pts:4, status:'ok', msg:"✅ Excellent ! (4/4)"};

        if (idee || tech) return {pts:2, status:'partiel', msg:"⚠️ Bien (2/4 pts). Pense au mot <strong>nomades</strong>."};

        return {pts:0, status:'faux', msg:"❌ Précise l'Afrique et les nomades."};

      }},

      { leconId: "hg_l3", titre: "Que signifie 'Paléolithique' et comment vivaient-ils ?", bareme: "4 pts", check: v => {

        const idee = v.includes('chasse') || v.includes('cueillette') || v.includes('pêche');

        const tech = v.includes('paléolithique') || v.includes('paleolithique') || v.includes('taillé');

        if (tech && idee) return {pts:4, status:'ok', msg:"✅ Parfait ! (4/4)"};

        if (idee) return {pts:2, status:'partiel', msg:"⚠️ Activités justes (2/4 pts). N'oublie pas le mot <strong>Paléolithique</strong>."};

        return {pts:0, status:'faux', msg:"❌ Mentionne la pierre taillée et la chasse."};

      }}

    ]

  },

  pc: {

    nom: "Physique (Thermique)",

    lecons: [

      { id: "pc_th1", titre: "Conductivité & Isolants thermiques" }

    ],

    fiches: [

      { titre: "Conducteur vs Isolant", contenu: "Conducteur thermique : laisse passer la chaleur (métaux). Isolant thermique : ne la laisse pas passer (bois, plastique)." }

    ],

    questions: [

      { leconId: "pc_th1", titre: "Pourquoi le métal paraît plus froid que le bois à 26°C ?", bareme: "4 pts", check: v => {

        const idee = v.includes('chaleur') || v.includes('main') || v.includes('perd');

        const tech = v.includes('conducteur') && v.includes('thermique');

        if (tech) return {pts:4, status:'ok', msg:"✅ Parfait ! (4/4)"};

        if (idee) return {pts:2, status:'partiel', msg:"⚠️ Bonne idée (2/4 pts). Terme exact : <strong>conducteur thermique</strong>."};

        return {pts:0, status:'faux', msg:"❌ Explique le transfert de chaleur."};

      }},

      { leconId: "pc_th1", titre: "Pourquoi le manche d'une casserole est-il en plastique ?", bareme: "4 pts", check: v => {

        const idee = v.includes('brûl') || v.includes('main') || v.includes('chaud');

        const tech = v.includes('isolant');

        if (tech) return {pts:4, status:'ok', msg:"✅ Impeccable ! (4/4)"};

        if (idee) return {pts:2, status:'partiel', msg:"⚠️ C'est bien pour ne pas se brûler (2/4 pts) ! Dis que c'est un <strong>isolant thermique</strong>."};

        return {pts:0, status:'faux', msg:"❌ Pense à la protection."};

      }}

    ]

  },

  svt: {

    nom: "SVT",

    lecons: [

      { id: "svt_l1", titre: "L'écosystème & Interactions" }

    ],

    fiches: [

      { titre: "Écosystème", contenu: "Réunit des êtres vivants, leur milieu de vie et leurs interactions." }

    ],

    questions: [

      { leconId: "svt_l1", titre: "Donne la définition précise d'un écosystème.", bareme: "4 pts", check: v => {

        const ok = v.includes('vivant') && v.includes('milieu');

        return {pts: ok?4:2, status: ok?'ok':'partiel', msg: ok?"✅ Parfait ! (4/4)":"⚠️ Pense aux êtres vivants et au milieu (2/4 pts)."};

      }}

    ]

  },

  anglais: {

    nom: "Anglais",

    lecons: [

      { id: "ang_l1", titre: "Prépositions ON / IN" }

    ],

    fiches: [

      { titre: "ON / IN", contenu: "ON devant un jour (ON Monday), IN devant un mois (IN July)." }

    ],

    questions: [

      { leconId: "ang_l1", titre: "Complète : 'The match is ______ Friday, and my birthday is ______ July.'", bareme: "4 pts", check: v => {

        const ok = v.includes('on') && v.includes('in');

        return {pts: ok?4:2, status: ok?'ok':'partiel', msg: ok?"✅ Parfait ! (4/4)":"⚠️ Vérifie ON et IN (2/4 pts)."};

      }}

    ]

  },

  maths: {

    nom: "Maths",

    lecons: [

      { id: "maths_l1", titre: "Nombres décimaux & Fractions" }

    ],

    fiches: [

      { titre: "Fractions décimales", contenu: "14 dixièmes = 14 / 10 = 1,4." }

    ],

    questions: [

      { leconId: "maths_l1", titre: "Écris le nombre décimal correspondant à la fraction 14/10.", bareme: "2 pts", check: v => {

        const ok = v.includes('1,4') || v.includes('1.4');

        return {pts: ok?2:0, status: ok?'ok':'faux', msg: ok?"✅ Exact (2/2)":"❌ 14/10 = 1,4"};

      }}

    ]

  }

};



let currentSub = 'hg';

let activeLecons = [];

let countQ = 3;



function changeSubject(sub) {

  currentSub = sub;

  document.querySelectorAll('.sub-btn').forEach(b => b.classList.remove('active'));

  document.getElementById(`btn_${sub}`).classList.add('active');



  const data = COURS_DATA[sub];

  activeLecons = data.lecons.map(l => l.id);



  document.getElementById('lessonChips').innerHTML = data.lecons.map(l => `

    <label style="background:var(--green-soft); padding:4px 8px; border-radius:6px; font-size:0.8rem; cursor:pointer; font-weight:600;">

      <input type="checkbox" value="${l.id}" checked onchange="toggleLesson('${l.id}')"> ${l.titre}

    </label>

  `).join('');



  renderView();

}



function toggleLesson(id) {

  if (activeLecons.includes(id)) {

    activeLecons = activeLecons.filter(x => x !== id);

  } else {

    activeLecons.push(id);

  }

  if (activeLecons.length === 0) activeLecons = COURS_DATA[currentSub].lecons.map(l => l.id);

  renderQuiz();

}



function setCount(n, btn) {

  countQ = n;

  document.querySelectorAll('.len-btn').forEach(b => b.classList.remove('active'));

  btn.classList.add('active');

  renderQuiz();

}



function switchTab(t) {

  document.getElementById('tabDevoir').classList.toggle('active', t === 'devoir');

  document.getElementById('tabCours').classList.toggle('active', t === 'cours');

  document.getElementById('viewDevoir').style.display = (t === 'devoir') ? 'block' : 'none';

  document.getElementById('viewCours').style.display = (t === 'cours') ? 'block' : 'none';

  if (t === 'cours') renderCours();

}



function renderView() {

  renderQuiz();

}



function renderQuiz() {

  const data = COURS_DATA[currentSub];

  const pool = data.questions.filter(q => activeLecons.includes(q.leconId));

  const selected = pool.sort(() => Math.random() - 0.5).slice(0, countQ);



  let html = '';

  if (selected.length === 0) {

    html = '<div class="card">Sélectionne au moins une leçon active.</div>';

  } else {

    selected.forEach((q, idx) => {

      html += `

        <div class="quiz-card" data-qid="${q.titre}">

          <div style="font-size:0.75rem; font-weight:800; color:var(--violet-primary);">QUESTION ${idx+1}</div>

          <div style="font-weight:800; color:var(--green-dark); margin:4px 0;">${q.titre}</div>

          <span style="font-size:0.8rem; background:#edf7f0; color:var(--green-primary); padding:2px 6px; border-radius:4px; font-weight:700;">📋 Barème : ${q.bareme}</span>

          <textarea class="answer-input" id="inp_${idx}" placeholder="Tape ta réponse ici..."></textarea>

          <div class="fb-box" id="fb_${idx}"></div>

        </div>

      `;

    });

  }

  document.getElementById('questionsContainer').innerHTML = html;

  document.getElementById('matchReport').style.display = 'none';

  window.currentSelectedQuestions = selected;

}



function renderCours() {

  const data = COURS_DATA[currentSub];

  document.getElementById('viewCours').innerHTML = data.fiches.map(f => `

    <div class="lesson-card">

      <div style="font-weight:800; color:var(--green-dark); margin-bottom:4px;">${f.titre}</div>

      <div style="font-size:0.9rem;">${f.contenu}</div>

    </div>

  `).join('');

}



function validerDevoir() {

  const selected = window.currentSelectedQuestions || [];

  let totalPts = 0, maxPts = selected.length * 4;

  let acquis = [], revoir = [];



  selected.forEach((q, idx) => {

    const val = (document.getElementById(`inp_${idx}`).value || '').toLowerCase().trim();

    const res = q.check(val);

    totalPts += (res.pts || 0);

    const fb = document.getElementById(`fb_${idx}`);

    fb.style.display = 'block';



    if (res.status === 'ok') {

      fb.className = 'fb-box fb-success'; fb.innerHTML = res.msg;

      acquis.push(q.titre);

    } else {

      fb.className = 'fb-box fb-warning';

      fb.innerHTML = `${res.msg} <button style="margin-top:6px; display:block; background:var(--violet-primary); color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;" onclick="document.getElementById('inp_${idx}').focus()">🔄 Corriger avec le mot technique</button>`;

      revoir.push(q.titre);

    }

  });



  const note20 = maxPts > 0 ? Math.round((totalPts / maxPts) * 20) : 0;

  document.getElementById('scoreFinal').innerText = `Note estimée : ${note20} / 20`;

  

  const badgeEl = document.getElementById('badgePalier');

  if (note20 >= 16) {

    badgeEl.innerHTML = "🌟 Très bien ! Maîtrise solide.";

    badgeEl.style.color = "var(--green-primary)";

    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });

  } else if (note20 >= 12) {

    badgeEl.innerHTML = "👍 Assez bien ! Continue comme ça.";

    badgeEl.style.color = "var(--blue-info)";

    confetti({ particleCount: 50, spread: 50, origin: { y: 0.6 } });

  } else {

    badgeEl.innerHTML = "💡 En cours d'acquisition. Révise les fiches et réessaie !";

    badgeEl.style.color = "var(--gold-accent)";

  }



  document.getElementById('cellAcquis').innerHTML = acquis.length ? acquis.map(a => `• ${a}<br>`).join('') : 'Rien.';

  document.getElementById('cellRevoir').innerHTML = revoir.length ? revoir.map(r => `• ${r}<br>`).join('') : '🎉 Tout est maîtrisé !';

  

  document.getElementById('matchReport').style.display = 'block';

  document.getElementById('matchReport').scrollIntoView({behavior:'smooth'});

}



window.onload = () => changeSubject('hg');

</script>

</body>

</html>
