<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CapDys - Mathieu 6ème • Hub de Révision Autonome</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Bungee&display=swap" rel="stylesheet" />

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-dys { font-family: 'Lexend', sans-serif; letter-spacing: 0.05em; line-height: 1.8; word-spacing: 0.12em; }
    .font-gaming { font-family: 'Bungee', cursive; }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(234, 179, 8, 0.4); }
      50% { box-shadow: 0 0 25px rgba(234, 179, 8, 0.8); }
    }
    .pulse-glow { animation: pulseGlow 2s infinite; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 transition-colors duration-200 antialiased selection:bg-amber-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const speakText = (text, rate = 0.95) => {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'fr-FR';
      utterance.rate = rate;
      window.speechSynthesis.speak(utterance);
    };

    const playSoundEffect = (type) => {
      try {
        if (type === 'victory' || type === 'success') {
          if (window.confetti) window.confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
        }
      } catch (e) {}
    };

    const SUBJECT_TABS = [
      { id: 'svt', label: 'SVT', icon: '🌱', color: 'from-emerald-500 to-teal-600' },
      { id: 'histoire', label: 'Histoire', icon: '🏛️', color: 'from-amber-500 to-orange-600' },
      { id: 'maths', label: 'Maths', icon: '📐', color: 'from-blue-500 to-indigo-600' },
      { id: 'anglais', label: 'Anglais', icon: '🇬🇧', color: 'from-rose-500 to-red-600' },
      { id: 'pc', label: 'Physique-Chimie', icon: '⚡', color: 'from-yellow-500 to-amber-600' },
      { id: 'geo', label: 'Géographie', icon: '🌍', color: 'from-teal-500 to-cyan-600' },
      { id: 'francais', label: 'Français', icon: '📚', color: 'from-purple-500 to-pink-600' }
    ];

    const COURS_DATA = {
      svt: {
        id: 'svt_ecosystemes',
        title: 'Leçon A1 - Les écosystèmes et le vivant',
        subject: 'svt',
        summaryKids: "Un écosystème réunit un milieu naturel, des êtres vivants et toutes les interactions qu'ils fabriquent ensemble.",
        audioFlashScript: "Bienvenue dans ton flash SVT ! Retiens bien les 3 piliers : Milieu, Êtres vivants et Interactions.",
        survivalSheet: { dangerRed: "Ne pas oublier le milieu de vie.", warningYellow: ["Milieu", "Vivants", "Interactions"], greenFoundation: "Écosystème = Décor naturel + Vivants + Liens" },
        quizQuestions: [
          {
            id: "svt_exam_def_ecosysteme",
            type: "qcm",
            subject: "svt",
            level: 1,
            titre: "Quelles sont les 3 composantes inséparables d'un écosystème ?",
            points: 2,
            options: ["Les êtres vivants, le milieu de vie, et leurs interactions", "Le soleil, la pluie, et les nuages"],
            correctIndex: 0,
            explanation: "Un écosystème réunit toujours le milieu, les êtres vivants et leurs liens mutuels !"
          }
        ]
      },
      histoire: {
        id: 'hist_prehistoire',
        title: "6H1 - Les débuts de l'humanité & Paléolithique",
        subject: 'histoire',
        summaryKids: "Les premiers humains sont nés en Afrique. Au Paléolithique, ils étaient nomades et taillaient le silex.",
        audioFlashScript: "Voici ton flash Histoire ! Fossile, nomade et migration sont les mots clés.",
        survivalSheet: { dangerRed: "Au Paléolithique, les humains sont nomades.", warningYellow: ["Nomade", "Fossile", "Afrique"], greenFoundation: "Préhistoire = Jusqu'à l'écriture (-3500)" },
        quizQuestions: [
          {
            id: "hist_3",
            type: "qcm",
            subject: "histoire",
            level: 2,
            titre: "De quel continent tous les premiers humains (Homo Sapiens) sont-ils originaires ?",
            points: 2,
            options: ["L'Afrique (le berceau de l'humanité)", "L'Europe", "L'Asie"],
            correctIndex: 0,
            explanation: "L'Afrique est le berceau de l'humanité."
          }
        ]
      },
      maths: {
        id: 'maths_fractions',
        title: 'Fractions, Décimaux & Tables de multiplication',
        subject: 'maths',
        summaryKids: "Le dénominateur indique les parts découpées, le numérateur indique les parts prises.",
        audioFlashScript: "Flash Maths : 7 x 8 = 56 et 8 x 9 = 72 !",
        survivalSheet: { dangerRed: "Attention à la position de la virgule.", warningYellow: ["Numérateur", "Dénominateur"], greenFoundation: "Dénominateur = en bas" },
        quizQuestions: [
          {
            id: "maths_table_7x8",
            type: "qcm",
            subject: "maths",
            level: 1,
            titre: "Combien font 7 x 8 ?",
            points: 2,
            options: ["56", "54", "48"],
            correctIndex: 0,
            explanation: "7 x 8 = 56 !"
          }
        ]
      },
      anglais: {
        id: 'anglais_intro',
        title: 'Dates, Nombres Ordinaux & Règles de Classe',
        subject: 'anglais',
        summaryKids: "En anglais, on utilise les nombres ordinaux pour la date (1st, 2nd, 3rd, 4th).",
        audioFlashScript: "Hello! 1st is first, 2nd is second, 3rd is third, then add TH.",
        survivalSheet: { dangerRed: "Attention aux exceptions 1st, 2nd, 3rd.", warningYellow: ["1st", "2nd", "3rd"], greenFoundation: "Date = Day + Month + ordinal" },
        quizQuestions: [
          {
            id: "anglais_ordinal_first",
            type: "qcm",
            subject: "anglais",
            level: 1,
            titre: "Comment écrit-on '1er' en anglais ?",
            points: 2,
            options: ["1st (first)", "1th (firth)"],
            correctIndex: 0,
            explanation: "1st s'écrit first !"
          }
        ]
      },
      pc: {
        id: 'pc_conducteurs',
        title: 'Physique-Chimie - Conducteurs, Isolants & Recyclage',
        subject: 'pc',
        summaryKids: "Un conducteur thermique laisse passer la chaleur. Les 3 bacs : Jaune, Vert, Marron.",
        audioFlashScript: "Flash Physique-Chimie : Conducteur laisse passer, isolant bloque.",
        survivalSheet: { dangerRed: "Ne pas confondre thermique et électrique.", warningYellow: ["Jaune", "Vert", "Marron"], greenFoundation: "3 bacs de tri" },
        quizQuestions: [
          {
            id: "pc_metal_conducteur",
            type: "vf",
            subject: "pc",
            level: 1,
            titre: "Vrai ou Faux : Tous les métaux sont de bons conducteurs thermiques.",
            points: 2,
            correctAnswer: "Vrai",
            explanation: "C'est VRAI, les métaux conduisent très bien la chaleur."
          }
        ]
      },
      geo: {
        id: 'geo_metropoles',
        title: '6G1 - Habiter les métropoles & Espaces urbains',
        subject: 'geo',
        summaryKids: "Une métropole est une très grande ville qui concentre la population.",
        audioFlashScript: "Flash Géo : Une métropole concentre population et activités.",
        survivalSheet: { dangerRed: "Ne pas confondre banlieue et centre.", warningYellow: ["Métropole", "CBD"], greenFoundation: "CBD = Quartier d'affaires" },
        quizQuestions: [
          {
            id: "geo_cbd_definition",
            type: "qcm",
            subject: "geo",
            level: 2,
            titre: "Que signifie le sigle CBD ?",
            points: 2,
            options: ["Central Business District", "Centre Bancaire"],
            correctIndex: 0,
            explanation: "Le CBD rassemble les gratte-ciels de bureaux."
          }
        ]
      },
      francais: {
        id: 'fr_homophones',
        title: 'Grammaire & Orthographe - Homophones',
        subject: 'francais',
        summaryKids: "Test de l'imparfait : 'a' remplaçable par 'avait', 'est' par 'était'.",
        audioFlashScript: "Flash Français : Remplace par 'avait' ou 'était' pour démasquer le verbe.",
        survivalSheet: { dangerRed: "Toujours faire le test du verbe.", warningYellow: ["a/à", "est/et"], greenFoundation: "Test du temps passé" },
        quizQuestions: [
          {
            id: "fr_homophone_a",
            type: "qcm",
            subject: "francais",
            level: 1,
            titre: "Complète : 'Mathieu ___ réussi son devoir.'",
            points: 2,
            options: ["a (avait réussi)", "à (avec accent)"],
            correctIndex: 0,
            explanation: "On peut dire 'Mathieu avait réussi', c'est 'a'."
          }
        ]
      }
    };

    function App() {
      const [currentSubject, setCurrentSubject] = useState('svt');
      const [activeSection, setActiveSection] = useState('quiz');
      const [isBattleRoyale, setIsBattleRoyale] = useState(false);
      const [dysFont, setDysFont] = useState(true);
      const [fontSize, setFontSize] = useState(18);
      const [rulerActive, setRulerActive] = useState(false);
      const [rulerY, setRulerY] = useState(150);
      const [xp, setXp] = useState(420);
      const [userAnswers, setUserAnswers] = useState({});

      useEffect(() => {
        const handleMouseMove = (e) => { if (rulerActive) setRulerY(e.clientY); };
        window.addEventListener('mousemove', handleMouseMove);
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, [rulerActive]);

      const subjectData = COURS_DATA[currentSubject] || COURS_DATA.svt;

      const handleAnswer = (questionId, index, isCorrect, pts) => {
        if (userAnswers[questionId] !== undefined) return;
        setUserAnswers(prev => ({ ...prev, [questionId]: index }));
        if (isCorrect) {
          playSoundEffect('success');
          setXp(prev => prev + pts * 10);
        }
      };

      return (
        <div className={`min-h-screen transition-colors duration-300 ${isBattleRoyale ? 'bg-slate-950 text-white' : 'bg-slate-50 text-slate-800'} ${dysFont ? 'font-dys' : ''}`} style={{ fontSize: `${fontSize}px` }}>
          {rulerActive && <div className="pointer-events-none fixed left-0 right-0 z-50 h-14 bg-amber-400/20 border-y-2 border-amber-500 shadow-lg transition-all duration-75" style={{ top: `${rulerY - 28}px` }} />}

          <header className={`sticky top-0 z-40 border-b backdrop-blur-md ${isBattleRoyale ? 'bg-slate-900/90 border-violet-800' : 'bg-white/95 border-slate-200'}`}>
            <div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className={`w-11 h-11 rounded-2xl flex items-center justify-center text-2xl shadow-md ${isBattleRoyale ? 'bg-gradient-to-tr from-amber-500 to-violet-600 pulse-glow' : 'bg-gradient-to-tr from-amber-400 to-orange-500'}`}>
                  {isBattleRoyale ? '⚡' : '🎓'}
                </div>
                <div>
                  <h1 className={`text-xl font-black tracking-tight ${isBattleRoyale ? 'text-amber-400 font-gaming' : 'text-slate-900'}`}>CapDys 6ème • Mathieu</h1>
                  <p className="text-xs text-slate-400 font-semibold">Hub de Révision Autonome</p>
                </div>
              </div>
              <div className="flex items-center gap-3">
                <div className="px-3.5 py-1.5 rounded-full bg-amber-100 text-amber-900 font-bold text-sm flex items-center gap-2 border border-amber-300">
                  <span>🏆</span><span>{xp} XP</span>
                </div>
                <button onClick={() => setIsBattleRoyale(!isBattleRoyale)} className={`px-3 py-1.5 rounded-xl font-bold transition-all ${isBattleRoyale ? 'bg-violet-600 text-white' : 'bg-slate-100 text-slate-700'}`}>
                  {isBattleRoyale ? '🔥 Mode Fortnite' : '🎮 Mode Classique'}
                </button>
              </div>
            </div>
          </header>

          <nav className="max-w-6xl mx-auto px-4 mt-6">
            <div className="flex items-center gap-2 overflow-x-auto pb-2">
              {SUBJECT_TABS.map(tab => (
                <button key={tab.id} onClick={() => { setCurrentSubject(tab.id); playSoundEffect('success'); }} className={`flex items-center gap-2 px-4 py-2.5 rounded-2xl font-bold whitespace-nowrap transition-all ${currentSubject === tab.id ? `bg-gradient-to-r ${tab.color} text-white shadow-md` : 'bg-white text-slate-700 border border-slate-200'}`}>
                  <span className="text-lg">{tab.icon}</span><span>{tab.label}</span>
                </button>
              ))}
            </div>
          </nav>

          <main className="max-w-6xl mx-auto px-4 py-6 space-y-6">
            <div className={`p-6 rounded-3xl border shadow-sm ${isBattleRoyale ? 'bg-slate-900 border-violet-800' : 'bg-white border-slate-200'}`}>
              <div className="flex items-start justify-between gap-4 flex-wrap">
                <div>
                  <span className="px-3 py-1 rounded-full bg-amber-100 text-amber-900 text-xs font-black uppercase tracking-wider">{subjectData.subject.toUpperCase()}</span>
                  <h2 className="text-2xl font-black mt-2">{subjectData.title}</h2>
                  <p className="mt-2 text-slate-600 leading-relaxed">{subjectData.summaryKids}</p>
                </div>
                <button onClick={() => speakText(subjectData.summaryKids)} className="px-4 py-2 rounded-2xl bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold text-sm shadow-xs">🔊 Écouter</button>
              </div>
            </div>

            <div className="space-y-6">
              {subjectData.quizQuestions.map((q, qIndex) => {
                const isAnswered = userAnswers[q.id] !== undefined;
                const selectedIdx = userAnswers[q.id];
                return (
                  <div key={q.id} className={`p-6 rounded-3xl border ${isBattleRoyale ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                    <div className="flex items-center gap-2 mb-4">
                      <span className="w-8 h-8 rounded-xl bg-slate-100 flex items-center justify-center font-black text-sm">{qIndex + 1}</span>
                      <span className="text-xs font-bold px-2.5 py-1 rounded-lg bg-amber-50 text-amber-800 border border-amber-200">Exercice • {q.points} pts</span>
                    </div>
                    <h3 className="text-lg font-bold mb-4">{q.titre}</h3>

                    {q.type === 'qcm' && q.options && (
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">
                        {q.options.map((opt, optIdx) => {
                          const isCorrect = optIdx === q.correctIndex;
                          let btnClass = 'bg-slate-50 border-slate-200 hover:bg-amber-50';
                          if (isAnswered) {
                            if (optIdx === q.correctIndex) btnClass = 'bg-emerald-500 text-white border-emerald-600';
                            else if (selectedIdx === optIdx) btnClass = 'bg-rose-500 text-white border-rose-600';
                            else btnClass = 'opacity-40 bg-slate-100 border-transparent';
                          }
                          return (
                            <button key={optIdx} disabled={isAnswered} onClick={() => handleAnswer(q.id, optIdx, isCorrect, q.points)} className={`p-4 rounded-2xl border text-left font-semibold text-sm transition-all flex items-center justify-between ${btnClass}`}>
                              <span>{opt}</span>
                              {isAnswered && optIdx === q.correctIndex && <span>✅</span>}
                            </button>
                          );
                        })}
                      </div>
                    )}

                    {isAnswered && q.explanation && (
                      <div className="mt-4 p-4 rounded-2xl bg-emerald-50 border border-emerald-200 text-sm text-emerald-900">
                        <div className="font-bold">💡 À retenir :</div>
                        <p>{q.explanation}</p>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
