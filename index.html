<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mastery Hub Mathieu - 6ème</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root {
  --bg-main: #f4fbf7; --card-bg: #ffffff; --text-main: #132a13;
  --green-primary: #2d6a4f; --green-soft: #e8f5e9; --violet-primary: #6d28d9; 
  --gold-accent: #d97706; --gold-light: #fef3c7; --border: #b7e4c7;
  --font-family: 'Lexend', sans-serif;
  --fn-epic: #9333ea; --fn-rare: #2563eb; --fn-legendary: #d97706; --fn-uncommon: #16a34a;
}
body.theme-br {
  --bg-main: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc;
  --green-primary: #10b981; --green-soft: #065f46; --violet-primary: #8b5cf6; 
  --gold-accent: #f59e0b; --gold-light: #78350f; --border: #334155;
}
body.dys-heavy { letter-spacing: 0.07em; word-spacing: 0.18em; line-height: 2.0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-family); background-color: var(--bg-main); color: var(--text-main); padding: 16px; line-height: 1.6; transition: background 0.3s, color 0.3s; }
.container { max-width: 840px; margin: 0 auto; }
.card { background: var(--card-bg); border-radius: 14px; padding: 16px; border: 2px solid var(--border); margin-bottom: 14px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
.sub-btn, .nav-btn, .len-btn, .chrono-toggle-btn { padding: 8px 12px; border-radius: 10px; border: 2px solid var(--border); background: var(--card-bg); font-weight: 800; cursor: pointer; color: var(--text-main); font-size: 0.9rem; transition: 0.2s; }
.sub-btn.active, .len-btn.active, .chrono-toggle-btn.active { background: var(--green-primary); color: #fff; border-color: var(--green-primary); }
.len-btn.active { background: var(--violet-primary); border-color: var(--violet-primary); }
.subject-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-bottom: 12px; }
.quiz-card { background: var(--card-bg); border-radius: 12px; padding: 16px; border: 2px solid var(--border); margin-bottom: 14px; }
.answer-container { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; }
.answer-input { flex: 1; min-height: 65px; padding: 10px; border-radius: 8px; border: 2px solid var(--border); background: var(--bg-main); color: var(--text-main); font-family: inherit; font-size: 0.95rem; }
.mic-btn { background: var(--card-bg); border: 2px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; font-size: 1.1rem; transition: 0.2s; color: var(--text-main); }
.mic-btn.listening { background: #fee2e2; border-color: #ef4444; animation: pulse 1.5s infinite; color: #000; }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
.fb-box { margin-top: 10px; padding: 10px; border-radius: 8px; font-size: 0.9rem; display: none; }
.fb-success { background: var(--green-soft); color: var(--green-primary); border: 1px solid var(--green-primary); }
.fb-warning { background: #fff7ed; color: #9a3412; border: 1px solid #fdba74; }
.bilan-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; color: var(--text-main); }
.bilan-table th, .bilan-table td { border: 1px solid var(--border); padding: 8px; vertical-align: top; }
.bilan-table th { background: var(--green-soft); color: var(--green-primary); text-align: left; }
.lesson-card { background: var(--card-bg); border-radius: 10px; border: 2px solid var(--border); margin-bottom: 8px; padding: 12px; }
.qcm-options { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.qcm-option { display: flex; align-items: center; gap: 8px; background: var(--bg-main); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--text-main); }
.vf-container { display: flex; gap: 12px; margin-top: 10px; }
.vf-btn { flex: 1; padding: 10px; border-radius: 8px; border: 2px solid var(--border); background: var(--card-bg); font-weight: 800; cursor: pointer; color: var(--text-main); text-align: center; }
.vf-btn.selected { background: var(--green-primary); color: #fff; border-color: var(--green-primary); }
.stats-box { background: var(--card-bg); border-radius: 10px; padding: 10px; margin-bottom: 14px; font-size: 0.82rem; font-weight: 700; color: var(--green-primary); border: 2px solid var(--border); display: flex; justify-content: space-around; align-items: center; text-align: center; flex-wrap: wrap; gap: 6px; }

.badge-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
.badge-card { background: var(--bg-main); border-radius: 12px; padding: 12px; border: 2px solid var(--border); display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden; }
.badge-card.unlocked { border-color: var(--gold-accent); background: linear-gradient(135deg, var(--card-bg) 0%, var(--gold-light) 100%); }
.badge-card.locked { opacity: 0.4; filter: grayscale(100%); }
.badge-icon { font-size: 2rem; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; background: var(--card-bg); border-radius: 10px; }
.badge-info h4 { font-size: 0.9rem; color: var(--text-main); margin-bottom: 2px; }
.badge-info p { font-size: 0.75rem; color: #71717a; }
.rarity-tag { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 4px; color: #fff; }
.rarity-uncommon { background: var(--fn-uncommon); }
.rarity-rare { background: var(--fn-rare); }
.rarity-epic { background: var(--fn-epic); }
.rarity-legendary { background: var(--fn-legendary); }
</style>
</head>
<body>
<div class="container">
  <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
    <div>
      <h1 id="mainTitle" style="color:var(--green-primary); font-size:1.2rem;">Mastery Hub Mathieu - 6ème</h1>
      <p id="subTitle" style="font-size:0.8rem; color:#555;">Entraînement intelligent & rigoureux</p>
    </div>
    <div style="display:flex; gap:6px; flex-wrap:wrap;">
      <button class="nav-btn" onclick="toggleTheme()" id="themeToggleBtn">🎮 Mode Battle Royale</button>
      <button class="nav-btn" onclick="document.body.classList.toggle('dys-heavy')">👓 Vue DYS</button>
    </div>
  </div>

  <div class="stats-box" id="globalStats">
    <div>📊 Séries : <span id="statSessions">0</span></div>
    <div>⭐ Meilleure note : <span id="statBest">-</span>/20</div>
    <div>🎯 Moyenne : <span id="statAvg">-</span>/20</div>
    <div>⚡ Meilleur Temps : <span id="statBestTime">-</span>s</div>
  </div>

  <div class="subject-grid">
    <button class="sub-btn active" id="btn_histoire" onclick="changeSubject('histoire')">📜 Histoire</button>
    <button class="sub-btn" id="btn_geo" onclick="changeSubject('geo')">🌍 Géo</button>
    <button class="sub-btn" id="btn_pc" onclick="changeSubject('pc')">🔥 Physique</button>
    <button class="sub-btn" id="btn_svt" onclick="changeSubject('svt')">🌱 SVT</button>
    <button class="sub-btn" id="btn_anglais" onclick="changeSubject('anglais')">🇬🇧 Anglais</button>
    <button class="sub-btn" id="btn_maths" onclick="changeSubject('maths')">📐 Maths</button>
    <button class="sub-btn" id="btn_mix" onclick="changeSubject('mix')" style="background:var(--violet-primary); color:#fff;">🎲 Mix Général</button>
  </div>

  <div class="card" id="filterBar">
    <div style="font-weight:800; font-size:0.85rem; color:var(--green-primary); margin-bottom:6px;" id="filterTitle">🎯 Leçons ciblées & Maîtrise :</div>
    <div id="lessonChips" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
  </div>

  <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
    <button class="nav-btn active" id="tabDevoir" onclick="switchTab('devoir')">📝 S'entraîner</button>
    <button class="nav-btn" id="tabCours" onclick="switchTab('cours')">📖 Fiches de cours</button>
    <button class="nav-btn" id="tabBadges" onclick="switchTab('badges')" style="background:var(--gold-light); color:var(--gold-accent); border-color:var(--gold-accent);">🏆 Casier (Badges)</button>
  </div>

  <div id="viewDevoir">
    <div class="card" id="selectorCard" style="display:flex; justify-content:space-between; align-items:center; padding:10px 16px; flex-wrap:wrap; gap:10px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-weight:800; font-size:0.9rem;">Questions :</span>
        <div style="display:flex; gap:4px;">
          <button class="len-btn active" onclick="setCount(5, this)">5</button>
          <button class="len-btn" onclick="setCount(10, this)">10</button>
          <button class="len-btn" onclick="setCount(20, this)">20</button>
        </div>
      </div>
      <div>
        <button class="chrono-toggle-btn" id="chronoToggleBtn" onclick="toggleChronoMode()">⏱️ Mode Chrono : OFF</button>
      </div>
    </div>

    <div id="poolNotice" style="display:none; background:var(--gold-light); color:var(--gold-accent); padding:8px 12px; border-radius:8px; font-size:0.85rem; font-weight:700; margin-bottom:10px; text-align:center; border:1px solid var(--gold-accent);"></div>

    <div id="chronoDisplay" style="display:none; text-align:center; font-weight:800; color:var(--violet-primary); margin-bottom:10px; font-size:1.1rem;">
      ⏱️ Temps écoulé : <span id="timerCount">0</span>s
    </div>

    <div id="questionsContainer"></div>

    <div style="text-align:center; margin:16px 0;" id="actionValidateContainer">
      <button class="sub-btn active" style="padding:12px 20px; font-size:1rem; background:var(--green-primary);" onclick="validerDevoir()" id="validateBtnText">📊 Valider et voir mon bilan</button>
    </div>

    <div class="card" id="matchReport" style="display:none;">
      <h2 id="reportTitle" style="color:var(--green-primary); font-size:1.1rem; text-align:center;">🎮 Bilan de l'évaluation</h2>
      <div id="scoreFinal" style="font-size:1.4rem; font-weight:800; color:var(--text-main); text-align:center; margin:8px 0;"></div>
      <div id="chronoResult" style="text-align:center; font-weight:700; color:var(--violet-primary); margin-bottom:6px; font-size:0.95rem;"></div>
      <div id="badgePalier" style="text-align:center; font-weight:700; margin-bottom:10px; font-size:1.1rem;"></div>
      <table class="bilan-table">
        <thead id="tableHeader"><tr><th>✅ Ce que je maîtrise bien</th><th>🔍 À revoir (Vocabulaire technique)</th></tr></thead>
        <tbody><tr><td id="cellAcquis"></td><td id="cellRevoir"></td></tr></tbody>
      </table>
      <div style="display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap;">
        <button class="sub-btn active" style="background:var(--green-primary); padding:10px 18px;" onclick="renderQuiz()">🔥 Enchaîner une nouvelle série</button>
        <div id="retryErrorContainer"></div>
      </div>
    </div>
  </div>

  <div id="viewCours" style="display:none;"></div>
  <div id="viewBadges" style="display:none;"></div>
</div>

<script>
const COURS_DATA = {
  histoire: {
    nom: "Histoire (6H1 : Les débuts de l'humanité)",
    lecons: [
      { id: "hist_l1", titre: "I - Qui sont les premiers humains ?" },
      { id: "hist_l2", titre: "II - Le peuplement de la Terre" },
      { id: "hist_l3", titre: "III - La vie au Paléolithique" }
    ],
    fiches: [
      { titre: "Vocabulaire clé", contenu: "• <strong>Préhistoire :</strong> Période de l'apparition des premiers humains à l'écriture (vers 3500 av. J.-C.).<br>• <strong>Fossile :</strong> Traces ou os préservés dans la roche.<br>• <strong>Paléolithique :</strong> L'âge de la pierre taillée.<br>• <strong>Nomade :</strong> Sans habitat fixe.<br>• <strong>Migrer :</strong> Se déplacer sur de longues distances." }
    ],
    questions: [
      { type: "libre", leconId: "hist_l1", titre: "Définis précisément ce qu'est un 'fossile' (mot-clé obligatoire).", points: 4, check: v => {
        const h = (v.includes('trace') || v.includes('os') || v.includes('reste') || v.includes('empreinte')) && (v.includes('roche') || v.includes('pierre') || v.includes('sol') || v.includes('terre'));
        return {pts: h?4:2, status: h?'ok':'partiel', max: 4, msg: h?"✅ Parfait ! (4/4)":"⚠️ Mentionne les traces ou os préservés dans la roche (2/4 pts)."};
      }},
      { type: "libre", leconId: "hist_l1", titre: "Définis la période de la 'Préhistoire' (début, fin et repère clé).", points: 4, check: v => {
        const h = (v.includes('debut') || v.includes('premiers') || v.includes('apparition') || v.includes('humain')) && (v.includes('ecriture') || v.includes('ecrit') || v.includes('histoire'));
        return {pts: h?4:2, status: h?'ok':'partiel', max: 4, msg: h?"✅ Parfait ! (4/4)":"⚠️ Elle va de l'apparition des premiers humains jusqu'à l'invention de l'écriture (2/4 pts)."};
      }},
      { type: "libre", leconId: "hist_l3", titre: "Explique ce qu'est un 'nomade' en utilisant les termes du cours.", points: 4, check: v => {
        const h = (v.includes('fixe') || v.includes('deplace') || v.includes('maison')) && (v.includes('chasse') || v.includes('cueillette') || v.includes('ressource'));
        return {pts: h?4:2, status: h?'ok':'partiel', max: 4, msg: h?"✅ Parfait ! (4/4)":"⚠️ Quelqu'un qui n'a pas d'habitat fixe et se déplace pour survivre (2/4 pts)."};
      }},
      { type: "libre", leconId: "hist_l2", titre: "Pourquoi parle-t-on de 'migration' pour les premiers hommes ?", points: 4, check: v => {
        const h = (v.includes('deplac') || v.includes('partir') || v.includes('quitt')) && (v.includes('afrique') || v.includes('terre') || v.includes('longue'));
        return {pts: h?4:2, status: h?'ok':'partiel', max: 4, msg: h?"✅ Parfait ! (4/4)":"⚠️ Ce sont de grands déplacements sur de longues distances hors d'Afrique (2/4 pts)."};
      }},
      { type: "qcm", leconId: "hist_l1", titre: "De quel continent est originaire l'Homo Sapiens ?", points: 2, options: ["L'Europe", "L'Afrique", "L'Asie", "L'Amérique"], correct: 1, check: val => ({pts: val===1?2:0, status: val===1?'ok':'faux', max: 2, msg: val===1?"✅ Parfait ! (2/2)":"❌ C'était l'Afrique."})},
      { type: "vf", leconId: "hist_l2", titre: "Vrai ou Faux : Les migrations hors d'Afrique ont débuté vers -100 000 ans.", points: 2, correct: "Vrai", check: val => ({pts: val==="Vrai"?2:0, status: val==="Vrai"?'ok':'faux', max: 2, msg: val==="Vrai"?"✅ Parfait ! (2/2)":"❌ C'est Vrai."})},
      { type: "qcm", leconId: "hist_l3", titre: "Que signifie le mot 'Paléolithique' ?", points: 2, options: ["L'âge de la pierre polie", "L'âge de la pierre taillée", "L'âge du bronze", "L'âge du feu"], correct: 1, check: val => ({pts: val===1?2:0, status: val===1?'ok':'faux', max: 2, msg: val===1?"✅ Parfait ! (2/2)":"❌ C'est l'âge de la pierre taillée."})},
      { type: "vf", leconId: "hist_l3", titre: "Vrai ou Faux : Au Paléolithique, les humains construisent des villages fortifiés avec des remparts.", points: 2, correct: "Faux", check: val => ({pts: val==="Faux"?2:0, status: val==="Faux"?'ok':'faux', max: 2, msg: val==="Faux"?"✅ Parfait ! (2/2)":"❌ Faux : ils sont nomades."})},
      { type: "qcm", leconId: "hist_l1", titre: "Quel nom donne-t-on au premier ancêtre de la lignée humaine découvert en Afrique (fameux fossile de Lucy) ?", points: 2, options: ["Homo Sapiens", "Australopithèque", "Homo Erectus", "Homme de Néandertal"], correct: 1, check: val => ({pts: val===1?2:0, status: val===1?'ok':'faux', max: 2, msg: val===1?"✅ Parfait ! (2/2)":"❌ C'est l'Australopithèque."})},
      { type: "qcm", leconId: "hist_l2", titre: "Quelle est la principale cause des grandes migrations humaines au Paléolithique ?", points: 2, options: ["Le tourisme", "La recherche de nouvelles terres de chasse et de ressources", "L'invention du train", "La construction de routes"], correct: 1, check: val => ({pts: val===1?2:0, status: val===1?'ok':'faux', max: 2, msg: val===1?"✅ Parfait ! (2/2)":"❌ La recherche de gibier et de ressources."})}
    ]
  },
  geo: {
    nom: "Géographie (Habiter les espaces)",
    lecons: [
      { id: "geo_l1", titre: "I - Habiter une métropole" },
      { id: "geo_l2", titre: "II - Habiter un espace à faible densité" }
    ],
    fiches: [
      { titre: "La métropole", contenu: "Espace urbain à forte concentration de population." }
    ],
    questions: [
      { type: "libre", leconId: "geo_l1", titre: "Définis ce qu'est une 'métropole' (mot-clé obligatoire).", points: 4, check: v => {
        const ok = (v.includes('ville') || v.includes('urbain')) && (v.includes('grande') || v.includes('population') || v.includes('activite'));
        return {pts: ok?4:2, status: ok?'ok':'partiel', max: 4, msg: ok?"✅ Parfait ! (4/4)":"⚠️ Pense à une grande ville avec de fortes activités et beaucoup d'habitants (2/4 pts)."};
      }},
      { type: "libre", leconId: "geo_l2", titre: "Qu'appelle-t-on un espace à 'faible densité' ?", points: 4, check: v => {
        const ok = (v.includes('peu') || v.includes('faible')) && (v.includes('habitant') || v.includes('km') || v.includes('personne'));
        return {pts: ok?4:2, status: ok?'ok':'partiel', max: 4, msg: ok?"✅ Parfait ! (4/4)":"⚠️ Un espace qui compte peu d'habitants au kilomètre carré (2/4 pts)."};
      }},
      { type: "qcm", leconId: "geo_l1", titre: "Comment qualifie-t-on une très grande métropole connectée au monde entier ?", points: 2, options: ["Un village", "Une mégapole", "Un hameau", "Une zone rurale"], correct: 1, check: val => ({pts: val===1?2:0, status: val===1?'ok':'faux', max: 2, msg: val===1?"✅ Parfait ! (2/2)":"❌ Une mégapole."})}
    ]
  },
  pc: {
    nom: "Physique-Chimie (Chapitre 1 : La matière)",
    lecons: [
      { id: "pc_l1", titre: "1 - Les déchets et le tri" },
      { id: "pc_l2", titre: "2 - La conductivité thermique" },
      { id: "pc_l3", titre: "3 - La conductivité électrique" }
    ],
    fiches: [
      { titre: "Leçon 1 & 2", contenu: "• <strong>Déchets :</strong> Poubelle jaune (métaux, cartons, plastiques), verre à part.<br>• <strong>Conducteur thermique :</strong> Laisse passer la chaleur (métaux).<br>• <strong>Isolant thermique :</strong> Bloque ou retarde la chaleur (bois, plastique, laine)." }
    ],
    questions: [
      { type: "libre", leconId: "pc_l2", titre: "Définis précisément le mot-clé 'conducteur thermique' et donne un exemple.", points: 4, check: v => {
        const h = (v.includes('laisse') || v.includes('laissent') || v.includes('laissant') || v.includes('conduit')) && (v.includes('chaleur') || v.includes('thermique')) && (v.includes('metal') || v.includes('métal') || v.includes('aluminium') || v.includes('cuivre'));
        return {pts: h?4:2, status: h?'ok':'partiel', max: 4, msg: h?"✅ Parfait ! (4/4)":"⚠️ Mentionne qu'il laisse passer la chaleur et donne un exemple de métal (2/4 pts)."};
      }},
      { type: "libre", leconId: "pc_l2", titre: "Définis précisément le mot-clé 'isolant thermique' et donne un exemple.", points: 4, check: v => {
        const h = (v.includes('empeche') || v.includes('empêche') || v.includes('bloque') || v.includes('retarde')) && (v.includes('chaleur') || v.includes('thermique')) && (v.includes('bois') || v.includes('plastique') || v.includes('laine') || v.includes('polystyrène'));
        return {pts: h?4:2, status: h?'ok':'partiel', max: 4, msg: h?"✅ Parfait ! (4/4)":"⚠️ Mentionne qu'il bloque la chaleur et donne un exemple comme le bois ou le plastique (2/4 pts)."};
      }},
      { type: "libre", leconId: "pc_l2", titre: "Texte à trous : Un matériau qui ne laisse pas passer facilement la chaleur est appelé un ______ thermique.", points: 2, check: v => {
        const h = v.includes('isolant');
        return {pts: h?2:0, status: h?'ok':'faux', max: 2, msg: h?"✅ Parfait ! (2/2)":"❌ Il fallait répondre 'isolant'."};
      }},
      { type: "libre", leconId: "pc_l1", titre: "Justifie pourquoi on jette les canettes en métal dans la poubelle jaune et non dans la nature.", points: 4, check: v => {
        const h = (v.includes('recycl') || v.includes('tri') || v.includes('environnement') || v.includes('degrade') || v.includes('dégrade')) && (v.includes('metal') || v.includes('métal') || v.includes('canette'));
        return {pts: h?4:2, status: h?'ok':'partiel', max: 4, msg: h?"✅ Parfait ! (4/4)":"⚠️ Explique que le métal se recycle pour être réutilisé et ne pollue pas la nature (2/4 pts)."};
      }},

let chronoEnabled = false;
let chronoSeconds = 0;
let chronoInterval = null;

function toggleChronoMode() {
  chronoEnabled = !chronoEnabled;
  const btn = document.getElementById('chronoToggleBtn');
  if (chronoEnabled) {
    btn.classList.add('active');
    btn.innerText = "⏱️ Mode Chrono : ON";
  } else {
    btn.classList.remove('active');
    btn.innerText = "⏱️ Mode Chrono : OFF";
  }
}

function startChrono() {
  stopChrono();
  if (!chronoEnabled) return;
  chronoSeconds = 0;
  const timerEl = document.getElementById('timerCount');
  if (timerEl) timerEl.innerText = chronoSeconds;
  const chronoDisp = document.getElementById('chronoDisplay');
  if (chronoDisp) chronoDisp.style.display = 'block';
  
  chronoInterval = setInterval(() => {
    chronoSeconds++;
    const tEl = document.getElementById('timerCount');
    if (tEl) tEl.innerText = chronoSeconds;
  }, 1000);
}

function stopChrono() {
  if (chronoInterval) {
    clearInterval(chronoInterval);
    chronoInterval = null;
  }
}

function getGlobalStats() {
  const saved = localStorage.getItem('mathieu_hub_stats');
  if (saved) { try { return JSON.parse(saved); } catch(e) {} }
  return { sessions: 0, totalScore: 0, bestScore: 0, bestTimes: {} };
}

function saveGlobalStats(note20, timeSec) {
  let stats = getGlobalStats();
  stats.sessions += 1;
  stats.totalScore += note20;
  if (note20 > stats.bestScore) stats.bestScore = note20;
  
  if (chronoEnabled && (note20 >= 16)) {
    if (!stats.bestTimes[currentSub] || timeSec < stats.bestTimes[currentSub]) {
      stats.bestTimes[currentSub] = timeSec;
    }
  }
  localStorage.setItem('mathieu_hub_stats', JSON.stringify(stats));
  updateStatsDisplay();
}

function updateStatsDisplay() {
  const stats = getGlobalStats();
  const s1 = document.getElementById('statSessions');
  const s2 = document.getElementById('statBest');
  const s3 = document.getElementById('statAvg');
  const s4 = document.getElementById('statBestTime');
  
  if (s1) s1.innerText = stats.sessions;
  if (s2) s2.innerText = stats.sessions > 0 ? stats.bestScore : '-';
  const avg = stats.sessions > 0 ? (stats.totalScore / stats.sessions).toFixed(1) : '-';
  if (s3) s3.innerText = avg;
  
  const bestT = stats.bestTimes && stats.bestTimes[currentSub] ? stats.bestTimes[currentSub] + 's' : '-';
  if (s4) s4.innerText = bestT;
}

function getLessonMastery(leconId) {
  const history = JSON.parse(localStorage.getItem('mathieu_lesson_history') || '{}');
  const score = history[leconId];
  if (score === undefined) return "⚪";
  if (score >= 16) return "🟢";
  if (score >= 12) return "🟠";
  return "🔴";
}

function saveLessonMastery(leconId, note20) {
  let history = JSON.parse(localStorage.getItem('mathieu_lesson_history') || '{}');
  if (!history[leconId] || note20 > history[leconId]) {
    history[leconId] = note20;
  }
  localStorage.setItem('mathieu_lesson_history', JSON.stringify(history));
}

function renderQuiz(customPool = null) {
  stopChrono();
  const cDisp = document.getElementById('chronoDisplay');
  if (cDisp) cDisp.style.display = 'none';
  const selCard = document.getElementById('selectorCard');
  if (selCard) selCard.style.display = 'flex';
  const actVal = document.getElementById('actionValidateContainer');
  if (actVal) actVal.style.display = 'block';

  let rawPool = [];
  if (customPool) {
    rawPool = customPool;
  } else if (currentSub === 'mix') {
    Object.keys(COURS_DATA).forEach(subKey => {
      rawPool = rawPool.concat(COURS_DATA[subKey].questions);
    });
  } else {
    const data = COURS_DATA[currentSub];
    if (data && data.questions) {
      rawPool = data.questions.filter(q => activeLecons.includes(q.leconId));
      if (rawPool.length === 0) rawPool = data.questions;
    }
  }

  const poolNotice = document.getElementById('poolNotice');
  if (poolNotice) {
    if (countQ > rawPool.length && currentSub !== 'mix') {
      poolNotice.style.display = 'block';
      poolNotice.innerText = `💡 Info : Stock de ${rawPool.length} questions uniques. Le système alterne les questions disponibles pour compléter la session de ${countQ}.`;
    } else {
      poolNotice.style.display = 'none';
    }
  }

  let baseQuestions = JSON.parse(JSON.stringify(rawPool)).sort(() => Math.random() - 0.5);
  let selected = [];

  while (selected.length < countQ) {
    if (baseQuestions.length === 0) {
      baseQuestions = JSON.parse(JSON.stringify(rawPool)).sort(() => Math.random() - 0.5);
    }
    let nextQ = baseQuestions.shift();
    if (selected.length > 0 && selected[selected.length - 1].titre === nextQ.titre && baseQuestions.length > 0) {
      baseQuestions.push(nextQ);
      nextQ = baseQuestions.shift();
    }
    selected.push(nextQ);
  }

  let html = '';
  if (selected.length === 0) {
    html = '<div class="card">Sélectionne au moins une leçon active.</div>';
  } else {
    selected.forEach((q, idx) => {
      let interactiveHTML = '';
      if (q.type === 'libre' || !q.type) {
        interactiveHTML = `
          <div class="answer-container">
            <textarea class="answer-input" id="inp_${idx}" placeholder="Tape ta réponse ou utilise le micro..."></textarea>
            <button type="button" class="mic-btn" id="mic_${idx}" onclick="toggleSpeech(${idx})" title="Dicter la réponse">🎤</button>
          </div>
        `;
      } else if (q.type === 'qcm') {
        interactiveHTML = `<div class="qcm-options">`;
        q.options.forEach((opt, optIdx) => {
          interactiveHTML += `
            <label class="qcm-option">
              <input type="radio" name="qcm_${idx}" value="${optIdx}"> ${opt}
            </label>
          `;
        });
        interactiveHTML += `</div>`;
      } else if (q.type === 'vf') {
        interactiveHTML = `
          <div class="vf-container">
            <button type="button" class="vf-btn" id="vf_${idx}_Vrai" onclick="selectVF(${idx}, 'Vrai')">Vrai</button>
            <button type="button" class="vf-btn" id="vf_${idx}_Faux" onclick="selectVF(${idx}, 'Faux')">Faux</button>
          </div>
          <input type="hidden" id="inp_${idx}" value="">
        `;
      }

      html += `
        <div class="quiz-card" data-qid="${q.titre}">
          <div style="font-size:0.75rem; font-weight:800; color:var(--violet-primary);">QUESTION ${idx+1} (${q.type ? q.type.toUpperCase() : 'LIBRE'})</div>
          <div style="font-weight:800; color:var(--text-main); margin:4px 0;">${q.titre}</div>
          <span style="font-size:0.8rem; background:var(--bg-main); color:var(--green-primary); padding:2px 6px; border-radius:4px; font-weight:700; border:1px solid var(--border);">📋 Barème : ${q.points} pts</span>
          ${interactiveHTML}
          <div class="fb-box" id="fb_${idx}"></div>
        </div>
      `;
    });
  }
  const qContainer = document.getElementById('questionsContainer');
  if (qContainer) qContainer.innerHTML = html;
  
  const mReport = document.getElementById('matchReport');
  if (mReport) mReport.style.display = 'none';
  
  window.currentSelectedQuestions = selected;
  startChrono();
}

function renderRetryQuiz() {
  if (lastFailedQuestions.length === 0) return;
  stopChrono();
  const cDisp = document.getElementById('chronoDisplay');
  if (cDisp) cDisp.style.display = 'none';
  const selCard = document.getElementById('selectorCard');
  if (selCard) selCard.style.display = 'none';
  const actVal = document.getElementById('actionValidateContainer');
  if (actVal) actVal.style.display = 'block';
  
  let html = '';
  lastFailedQuestions.forEach((q, idx) => {
    let interactiveHTML = '';
    if (q.type === 'libre' || !q.type) {
      interactiveHTML = `
        <div class="answer-container">
          <textarea class="answer-input" id="inp_${idx}" placeholder="Tape ta réponse ou utilise le micro..."></textarea>
          <button type="button" class="mic-btn" id="mic_${idx}" onclick="toggleSpeech(${idx})" title="Dicter la réponse">🎤</button>
        </div>
      `;
    } else if (q.type === 'qcm') {
      interactiveHTML = `<div class="qcm-options">`;
      q.options.forEach((opt, optIdx) => {
        interactiveHTML += `
          <label class="qcm-option">
            <input type="radio" name="qcm_${idx}" value="${optIdx}"> ${opt}
          </label>
        `;
      });
      interactiveHTML += `</div>`;
    } else if (q.type === 'vf') {
      interactiveHTML = `
        <div class="vf-container">
          <button type="button" class="vf-btn" id="vf_${idx}_Vrai" onclick="selectVF(${idx}, 'Vrai')">Vrai</button>
          <button type="button" class="vf-btn" id="vf_${idx}_Faux" onclick="selectVF(${idx}, 'Faux')">Faux</button>
        </div>
        <input type="hidden" id="inp_${idx}" value="">
      `;
    }

    html += `
      <div class="quiz-card" data-qid="${q.titre}">
        <div style="font-size:0.75rem; font-weight:800; color:var(--violet-primary);">🔄 REVOIR ERREUR ${idx+1}</div>
        <div style="font-weight:800; color:var(--text-main); margin:4px 0;">${q.titre}</div>
        <span style="font-size:0.8rem; background:var(--bg-main); color:var(--green-primary); padding:2px 6px; border-radius:4px; font-weight:700; border:1px solid var(--border);">📋 Barème : ${q.points} pts</span>
        ${interactiveHTML}
        <div class="fb-box" id="fb_${idx}"></div>
      </div>
    `;
  });
  const qContainer = document.getElementById('questionsContainer');
  if (qContainer) qContainer.innerHTML = html;
  
  const mReport = document.getElementById('matchReport');
  if (mReport) mReport.style.display = 'none';
  
  window.currentSelectedQuestions = lastFailedQuestions;
  window.scrollTo({top: 0, behavior: 'smooth'});
  startChrono();
}

function toggleSpeech(idx) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("La dictée vocale n'est pas supportée par ce navigateur.");
    return;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = 'fr-FR';
  const micBtn = document.getElementById(`mic_${idx}`);
  const textarea = document.getElementById(`inp_${idx}`);

  if (micBtn) {
    micBtn.classList.add('listening');
    micBtn.innerText = "🔴";
  }

  recognition.onresult = (e) => { if (textarea) textarea.value = e.results[0][0].transcript; };
  recognition.onend = () => {
    if (micBtn) {
      micBtn.classList.remove('listening');
      micBtn.innerText = "🎤";
    }
  };
  recognition.start();
}

function selectVF(idx, val) {
  const inp = document.getElementById(`inp_${idx}`);
  if (inp) inp.value = val;
  const btnV = document.getElementById(`vf_${idx}_Vrai`);
  const btnF = document.getElementById(`vf_${idx}_Faux`);
  if (btnV) btnV.classList.remove('selected');
  if (btnF) btnF.classList.remove('selected');
  const btnSel = document.getElementById(`vf_${idx}_${val}`);
  if (btnSel) btnSel.classList.add('selected');
}

function renderCours() {
  const vCour = document.getElementById('viewCours');
  if (!vCour) return;
  if (currentSub === 'mix') {
    vCour.innerHTML = '<div class="card">Le mode Mix Général mélange toutes les matières. Choisis une matière spécifique pour voir ses fiches de cours.</div>';
    return;
  }
  const data = COURS_DATA[currentSub];
  if (data && data.fiches) {
    vCour.innerHTML = data.fiches.map(f => `
      <div class="lesson-card">
        <div style="font-weight:800; color:var(--violet-primary); margin-bottom:4px;">${f.titre}</div>
        <div style="font-size:0.9rem; color:var(--text-main);">${f.contenu}</div>
      </div>
    `).join('');
  }
}

function validerDevoir() {
  stopChrono();
  const cDisp = document.getElementById('chronoDisplay');
  if (cDisp) cDisp.style.display = 'none';

  const selected = window.currentSelectedQuestions || [];
  let totalPtsObtenus = 0, totalPtsMax = 0;
  let acquis = [], revoir = [];
  let failedObjects = [];

  selected.forEach((q, idx) => {
    let res = { pts: 0, status: 'faux', max: q.points || 4, msg: '❌ Erreur' };

    if (q.type === 'qcm') {
      const selectedRadio = document.querySelector(`input[name="qcm_${idx}"]:checked`);
      const val = selectedRadio ? parseInt(selectedRadio.value) : -1;
      res = q.check(val);
    } else if (q.type === 'vf') {
      const inpVal = document.getElementById(`inp_${idx}`);
      const val = inpVal ? inpVal.value : '';
      res = q.check(val);
    } else {
      const inpText = document.getElementById(`inp_${idx}`);
      const val = (inpText ? inpText.value : '').toLowerCase().trim();
      res = q.check(val);
    }

    totalPtsObtenus += (res.pts || 0);
    totalPtsMax += (res.max || q.points || 4);

    const fb = document.getElementById(`fb_${idx}`);
    if (fb) {
      fb.style.display = 'block';
      if (res.status === 'ok') {
        fb.className = 'fb-box fb-success'; 
        fb.innerHTML = res.msg;
        acquis.push(q.titre);
      } else {
        fb.className = 'fb-box fb-warning';
        const actionBtn = (q.type === 'libre' || !q.type) ? `<button style="margin-top:6px; display:block; background:var(--violet-primary); color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;" onclick="document.getElementById('inp_${idx}').focus()">🔄 Corriger avec le mot technique</button>` : '';
        fb.innerHTML = `${res.msg} ${actionBtn}`;
        revoir.push(q.titre);
        failedObjects.push(q);
      }
    }

    if (currentSub !== 'mix') {
      const ratio = (res.pts || 0) / (res.max || q.points || 4);
      saveLessonMastery(q.leconId, ratio === 1 ? 20 : (ratio > 0 ? 12 : 8));
    }
  });

  lastFailedQuestions = failedObjects;

  const note20 = totalPtsMax > 0 ? Math.round((totalPtsObtenus / totalPtsMax) * 20) : 0;
  saveGlobalStats(note20, chronoSeconds);

  const sFinal = document.getElementById('scoreFinal');
  if (sFinal) sFinal.innerText = `Note estimée : ${note20} / 20`;
  
  const chronoResEl = document.getElementById('chronoResult');
  if (chronoResEl) {
    if (chronoEnabled) {
      chronoResEl.innerText = `⏱️ Temps réalisé : ${chronoSeconds} secondes`;
      chronoResEl.style.display = 'block';
    } else {
      chronoResEl.style.display = 'none';
    }
  }

  const badgeEl = document.getElementById('badgePalier');
  if (badgeEl) {
    if (note20 >= 16) {
      badgeEl.innerHTML = isBattleRoyaleMode ? "🎉 VICTOIRE ROYALE ! Top 1 Maîtrisé !" : "🎉 Très bien ! Maîtrise solide.";
      badgeEl.style.color = "var(--green-primary)";
      confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
    } else if (note20 >= 12) {
      badgeEl.innerHTML = isBattleRoyaleMode ? "👍 Top 10 ! Bien joué, continue." : "👍 Assez bien ! Continue comme ça.";
      badgeEl.style.color = "var(--blue-info)";
    } else {
      badgeEl.innerHTML = isBattleRoyaleMode ? "🤔 Éliminé... Relance une game et révise !" : "🤔 En cours d'acquisition. Révise et réessaie !";
      badgeEl.style.color = "var(--gold-accent)";
    }
  }

  const cAcquis = document.getElementById('cellAcquis');
  const cRevoir = document.getElementById('cellRevoir');
  if (cAcquis) cAcquis.innerHTML = acquis.length ? acquis.map(a => `• ${a}<br>`).join('') : 'Rien.';
  if (cRevoir) cRevoir.innerHTML = revoir.length ? revoir.map(r => `• ${r}<br>`).join('') : '🎉 Tout est maîtrisé !';
  
  const retryContainer = document.getElementById('retryErrorContainer');
  if (retryContainer) {
    if (revoir.length > 0) {
      retryContainer.innerHTML = `<button class="sub-btn active" style="background:var(--violet-primary); padding:10px 18px;" onclick="renderRetryQuiz()">🔄 Revenir sur la zone (Refaire ses erreurs)</button>`;
    } else {
      retryContainer.innerHTML = `<p style="font-weight:700; color:var(--green-primary);">🏆 Zéro faute ! Impressionnant.</p>`;
    }
  }

  const mReport = document.getElementById('matchReport');
  if (mReport) {
    mReport.style.display = 'block';
    mReport.scrollIntoView({behavior:'smooth'});
  }
}

window.onload = () => {
  updateStatsDisplay();
  changeSubject('histoire');
};
</script>
