<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CapDys - Mathieu 6ème</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: "Plus Jakarta Sans", sans-serif; }
    .dys-mode { font-family: "Lexend", sans-serif; letter-spacing: 0.05em; line-height: 1.8; word-spacing: 0.15em; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .anim-fade { animation: fadeIn 0.25s ease-out forwards; }
  </style>
</head>
<body class="bg-amber-50/40 text-slate-800 antialiased selection:bg-amber-300">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUBJECTS = [
      { id: "svt", name: "SVT", icon: "🌱", color: "from-emerald-500 to-teal-600" },
      { id: "histoire", name: "Histoire", icon: "🏛️", color: "from-amber-600 to-yellow-600" },
      { id: "geo", name: "Géographie", icon: "🌍", color: "from-sky-500 to-blue-600" },
      { id: "pc", name: "Physique-Chimie", icon: "⚡", color: "from-indigo-500 to-violet-600" },
      { id: "anglais", name: "Anglais", icon: "🇬🇧", color: "from-red-500 to-rose-600" },
      { id: "maths", name: "Maths", icon: "📐", color: "from-cyan-500 to-blue-600" },
      { id: "francais", name: "Français", icon: "📚", color: "from-fuchsia-500 to-pink-600" }
    ];

    const LESSONS = {
      svt: {
        title: "SVT • Les Écosystèmes et le Vivant",
        videoScript: "Un écosystème réunit 3 éléments complémentaires : 1, le milieu non vivant (le biotope). 2, les êtres vivants (la biocénose). 3, toutes les interactions entre eux.",
        flash: "Biotope (décor non vivant) + Biocénose (êtres vivants) = Écosystème !",
        quiz: [
          { q: "Quels sont les 3 piliers essentiels d'un écosystème ?", options: ["1. Biotope, 2. Biocénose, 3. Interactions", "1. Eau, 2. Feu, 3. Terre", "1. Plantes, 2. Animaux, 3. Humains"], rep: 0 },
          { q: "Le biotope représente la partie vivante ou non vivante ?", options: ["Non vivante (eau, roches, climat)", "Vivante (animaux et plantes)"], rep: 0 }
        ]
      },
      histoire: {
        title: "Histoire • Les Premiers Hommes & Préhistoire",
        videoScript: "Vers -3500 avant J.-C., l'invention de l'écriture en Mésopotamie marque la fin de la Préhistoire et le début de l'Histoire.",
        flash: "Retiens bien la date clé : vers -3500, la naissance de l'écriture ouvre l'Histoire !",
        quiz: [
          { q: "En quelle année l'écriture est-elle inventée en Mésopotamie ?", options: ["Vers -3500", "Vers 1500", "En l'an 0"], rep: 0 },
          { q: "Où sont nés les premiers êtres humains (berceau de l'humanité) ?", options: ["En Afrique", "En Europe", "En Asie"], rep: 0 }
        ]
      },
      geo: {
        title: "Géographie • Les Continents et les Océans",
        videoScript: "La Terre compte 6 grands continents et 5 grands océans. L'océan Pacifique est le plus vaste de tous !",
        flash: "6 continents (Afrique, Amérique, Asie, Europe, Océanie, Antarctique) et 5 océans !",
        quiz: [
          { q: "Combien y a-t-il de continents et d'océans ?", options: ["6 continents et 5 océans", "4 continents et 4 océans", "7 continents et 3 océans"], rep: 0 },
          { q: "Quel est le plus grand océan de notre planète ?", options: ["L'océan Pacifique", "L'océan Atlantique", "L'océan Indien"], rep: 0 }
        ]
      },
      pc: {
        title: "Physique-Chimie • Les Déchets & les 3 Bacs de Tri",
        videoScript: "En physique-chimie, voici les 3 bacs de tri indispensables : 1, la poubelle jaune pour les emballages en plastique, métaux et cartons. 2, le conteneur vert pour le verre. 3, le bac à compost pour les déchets organiques.",
        flash: "3 bacs : 1. Jaune (emballages et métaux), 2. Vert (verre), 3. Marron (compost) !",
        quiz: [
          { q: "Dans quelle poubelle jette-t-on une canette de soda en aluminium recyclable ?", options: ["Le bac jaune (emballages et métaux)", "Le bac vert (verre)", "La poubelle ordinaire"], rep: 0 },
          { q: "Un matériau qui laisse circuler la chaleur s'appelle :", options: ["Un conducteur thermique (comme les métaux)", "Un isolant thermique (comme le bois)"], rep: 0 }
        ]
      },
      anglais: {
        title: "Anglais • Nombres, Dates et Prépositions",
        videoScript: "Pour compter en anglais : 1, trait d'union entre 21 et 99. 2, quarante s'écrit forty sans U. 3, cent, mille et million sont invariables au pluriel.",
        flash: "ON pour un jour précis (on Monday). IN pour un mois ou une année (in July, in 2026).",
        quiz: [
          { q: "Quelle préposition utilise-t-on devant un jour précis ?", options: ["ON (ex: on Friday)", "IN (ex: in Friday)", "AT (ex: at Friday)"], rep: 0 },
          { q: "Comment s'écrit correctement le chiffre quarante en anglais ?", options: ["forty (sans U)", "fourty (avec un U)", "fourteen"], rep: 0 }
        ]
      },
      maths: {
        title: "Mathématiques • Les Fractions et le Partage",
        videoScript: "Une fraction représente un partage équitable : le numérateur en haut indique le nombre de parts prises, le dénominateur en bas indique le total de parts.",
        flash: "Numérateur (haut = parts prises) sur Dénominateur (bas = parts totales découpées) !",
        quiz: [
          { q: "Si on coupe une pizza en 4 parts égales et qu'on en mange 3, quelle est la fraction ?", options: ["3/4", "4/3", "1/4"], rep: 0 },
          { q: "Quel nombre se trouve en bas d'une fraction ?", options: ["Le dénominateur", "Le numérateur"], rep: 0 }
        ]
      },
      francais: {
        title: "Français • Les Accords du Participe Passé",
        videoScript: "Avec l'auxiliaire Être, le participe passé s'accorde toujours avec le sujet. Avec Avoir, il s'accorde uniquement si le COD est placé devant le verbe.",
        flash: "Être = accord avec le sujet. Avoir = accord seulement avec le COD placé devant !",
        quiz: [
          { q: "Dans la phrase Les filles sont arrivées, pourquoi met-on ées ?", options: ["Car c'est l'auxiliaire Être (accord avec le sujet féminin pluriel)", "Car c'est l'auxiliaire Avoir"], rep: 0 },
          { q: "Avec l'auxiliaire Avoir, quand fait-on l'accord ?", options: ["Seulement si le COD est placé avant le verbe", "Toujours", "Jamais"], rep: 0 }
        ]
      }
    };

    function App() {
      const [activeTab, setActiveTab] = useState("video");
      const [currentSub, setCurrentSub] = useState("svt");
      const [isBattleRoyale, setIsBattleRoyale] = useState(false);
      const [dyslexicMode, setDyslexicMode] = useState(false);
      const [fontScale, setFontScale] = useState(1);
      const [isRulerActive, setIsRulerActive] = useState(false);
      const [rulerY, setRulerY] = useState(200);
      const [isSommaireOpen, setIsSommaireOpen] = useState(false);
      const [isPhotoOpen, setIsPhotoOpen] = useState(false);
      const [photoScanning, setPhotoScanning] = useState(false);
      const [score, setScore] = useState(0);
      const [quizIndex, setQuizIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [answered, setAnswered] = useState(false);
      const [userText, setUserText] = useState("");
      const [textFeedback, setTextFeedback] = useState(null);
      const fileInputRef = useRef(null);

      const subData = LESSONS[currentSub];
      const currentQ = subData.quiz[quizIndex % subData.quiz.length];

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (isRulerActive) setRulerY(e.clientY);
        };
        window.addEventListener("mousemove", handleMouseMove);
        return () => window.removeEventListener("mousemove", handleMouseMove);
      }, [isRulerActive]);

      const handleAnswer = (idx) => {
        if (answered) return;
        setSelectedOption(idx);
        setAnswered(true);
        if (idx === currentQ.rep) {
          setScore((s) => s + 10);
          confetti({ particleCount: 70, spread: 60, origin: { y: 0.7 } });
        }
      };

      const handleValidateText = () => {
        if (!userText.trim()) return;
        const hasCar = /\b(car|parce que|donc|grâce à|pour)\b/i.test(userText);
        const hasEx = /\b(exemple|chez moi|comme|j'ai|nous)\b/i.test(userText);
        if (hasCar && hasEx) {
          setTextFeedback("🌟 20/20 ! Exemple perso + justification complète !");
          setScore((s) => s + 20);
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        } else if (hasCar || hasEx) {
          setTextFeedback("🟢 16/20 ! Bonne argumentation. Pense à ajouter à la fois ton exemple perso et un 'car' !");
          setScore((s) => s + 10);
        } else {
          setTextFeedback("🟡 12/20 ! Pense à faire une phrase avec 'car' ou 'parce que' pour avoir tous les points.");
        }
      };

      const handlePhotoSimulate = () => {
        setPhotoScanning(true);
        setTimeout(() => {
          setPhotoScanning(false);
          setIsPhotoOpen(false);
          setActiveTab("quiz");
          confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        }, 1200);
      };

      return (
        <div style={{ fontSize: `${fontScale}rem` }} className={`min-h-screen flex flex-col transition-colors ${dyslexicMode ? "dys-mode" : ""} ${isBattleRoyale ? "bg-slate-950 text-slate-100" : "bg-[#faf7f2] text-slate-900"}`}>
          {isRulerActive && (
            <div style={{ top: `${rulerY - 24}px` }} className="fixed left-0 right-0 h-14 bg-amber-400/25 border-y-2 border-amber-500/80 pointer-events-none z-50 transition-all duration-75"></div>
          )}

          <header className={`sticky top-0 z-40 border-b backdrop-blur-md shadow-xs ${isBattleRoyale ? "bg-slate-900/95 border-purple-500/40 text-slate-100" : "bg-white/95 border-amber-200/80 text-slate-800"}`}>
            <div className="max-w-6xl mx-auto px-4 py-2.5">
              <div className="flex items-center justify-between gap-3">
                <div className="flex items-center gap-2.5">
                  <div className={`h-10 w-10 rounded-2xl flex items-center justify-center font-bold text-lg shadow-sm ${isBattleRoyale ? "bg-gradient-to-tr from-purple-600 to-indigo-600 text-white" : "bg-gradient-to-tr from-indigo-600 to-amber-400 text-white"}`}>
                    {isBattleRoyale ? "⚡" : "🚀"}
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <h1 className="text-lg font-black tracking-tight">CapDys Mathieu</h1>
                      <span className={`text-[10px] font-black px-2 py-0.5 rounded-full uppercase ${isBattleRoyale ? "bg-purple-900/80 text-purple-200 border border-purple-500/40" : "bg-emerald-100 text-emerald-800"}`}>
                        6ème Réussite
                      </span>
                    </div>
                    <p className="text-[11px] opacity-75 hidden sm:block">Entraîneur autonome, leçons & méthodes gagnantes</p>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <button onClick={() => setIsSommaireOpen(true)} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-black border transition-all cursor-pointer ${isBattleRoyale ? "bg-purple-950 text-amber-300 border-amber-400/60" : "bg-amber-100 text-amber-950 border-amber-300"}`}>
                    <span>📚 Sommaire</span>
                  </button>

                  <button onClick={() => setIsPhotoOpen(true)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-slate-950 font-black text-xs shadow-xs cursor-pointer transition-transform hover:scale-105">
                    <span>📸 Photo</span>
                  </button>

                  <div className="flex items-center px-2 py-1 rounded-xl bg-amber-500/20 border border-amber-500/40 text-xs font-black">
                    <span>⭐ {score} pts</span>
                  </div>
                </div>
              </div>

              <div className={`mt-2 pt-2 border-t flex flex-wrap items-center justify-between gap-2 text-xs ${isBattleRoyale ? "border-slate-800 text-slate-400" : "border-slate-200 text-slate-500"}`}>
                <div className="flex items-center gap-1.5 font-bold text-[11px]">
                  <span>👓 Confort de lecture :</span>
                </div>

                <div className="flex items-center gap-2 flex-wrap">
                  <button onClick={() => setIsBattleRoyale(!isBattleRoyale)} className={`flex items-center gap-1 px-2.5 py-1 rounded-xl text-xs font-black border transition-all cursor-pointer ${isBattleRoyale ? "bg-gradient-to-r from-purple-600 to-indigo-600 text-white border-purple-400" : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50"}`}>
                    <span>{isBattleRoyale ? "🎮 Mode Fortnite" : "🏫 Mode Classique"}</span>
                  </button>

                  <button onClick={() => setIsRulerActive(!isRulerActive)} className={`flex items-center gap-1 px-2.5 py-1 rounded-xl text-xs font-bold border transition-all cursor-pointer ${isRulerActive ? "bg-amber-400 text-slate-950 border-amber-500 font-black" : "bg-white text-slate-700 border-slate-200"}`}>
                    <span>Règle {isRulerActive ? "ON" : "OFF"}</span>
                  </button>

                  <button onClick={() => setDyslexicMode(!dyslexicMode)} className={`flex items-center gap-1 px-2.5 py-1 rounded-xl text-xs font-bold border transition-all cursor-pointer ${dyslexicMode ? "bg-amber-500 text-white border-amber-600 font-black" : "bg-white text-slate-700 border-slate-200"}`}>
                    <span>Police DYS {dyslexicMode ? "ON" : "OFF"}</span>
                  </button>

                  <div className="flex items-center p-0.5 rounded-xl border bg-white border-slate-200 text-slate-800">
                    <button onClick={() => setFontScale((s) => Math.max(0.9, Number((s - 0.1).toFixed(1))))} className="px-1.5 py-0.5 font-bold cursor-pointer">-</button>
                    <span className="px-1 text-[11px] font-bold">{Math.round(fontScale * 100)}%</span>
                    <button onClick={() => setFontScale((s) => Math.min(1.4, Number((s + 0.1).toFixed(1))))} className="px-1.5 py-0.5 font-bold cursor-pointer">+</button>
                  </div>
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 py-5 w-full flex-1 space-y-5">
            <nav className="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
              <button onClick={() => setActiveTab("video")} className={`px-4 py-2 rounded-xl text-xs font-black transition-all cursor-pointer shrink-0 ${activeTab === "video" ? "bg-indigo-600 text-white shadow-xs" : "bg-white text-slate-700 hover:bg-slate-100 border border-slate-200"}`}>
                🖥️ Tableau
              </button>
              <button onClick={() => setActiveTab("survival")} className={`px-4 py-2 rounded-xl text-xs font-black transition-all cursor-pointer shrink-0 ${activeTab === "survival" ? "bg-amber-500 text-white shadow-xs" : "bg-white text-slate-700 hover:bg-slate-100 border border-slate-200"}`}>
                ⚡ Flash & Mémo
              </button>
              <button onClick={() => setActiveTab("quiz")} className={`px-4 py-2 rounded-xl text-xs font-black transition-all cursor-pointer shrink-0 ${activeTab === "quiz" ? "bg-emerald-600 text-white shadow-xs" : "bg-white text-slate-700 hover:bg-slate-100 border border-slate-200"}`}>
                🎯 Mon Quiz
              </button>
              <button onClick={() => setActiveTab("parent")} className={`px-4 py-2 rounded-xl text-xs font-black transition-all cursor-pointer shrink-0 ${activeTab === "parent" ? "bg-purple-600 text-white shadow-xs" : "bg-white text-slate-700 hover:bg-slate-100 border border-slate-200"}`}>
                🔒 Parent
              </button>
            </nav>

            <div className="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
              {SUBJECTS.map((sub) => (
                <button key={sub.id} onClick={() => { setCurrentSub(sub.id); setQuizIndex(0); setAnswered(false); setSelectedOption(null); setUserText(""); setTextFeedback(null); }} className={`flex items-center gap-1.5 px-3 py-2 rounded-2xl text-xs font-black transition-all cursor-pointer shrink-0 border ${currentSub === sub.id ? "bg-indigo-600 text-white border-indigo-400 shadow-sm" : "bg-white text-slate-700 border-slate-200 hover:bg-slate-50"}`}>
                  <span>{sub.icon}</span>
                  <span>{sub.name}</span>
                </button>
              ))}
            </div>

            {activeTab === "video" && (
              <div className="anim-fade p-6 rounded-3xl bg-white border border-slate-200 shadow-sm space-y-4">
                <div className="flex items-center justify-between border-b pb-3">
                  <span className="text-xs font-black uppercase tracking-wider text-indigo-600">🖥️ Tableau de Classe • Cours Interactif</span>
                  <span className="text-xs font-bold px-2.5 py-0.5 rounded-lg bg-emerald-100 text-emerald-800">Prêt pour le collège</span>
                </div>
                <h2 className="text-xl font-black text-slate-900">{subData.title}</h2>
                <div className="p-5 rounded-2xl bg-amber-50/80 border border-amber-200 text-slate-800 space-y-3">
                  <div className="flex items-center gap-2 font-black text-sm text-amber-900">
                    <span>💡 Ce que le professeur explique :</span>
                  </div>
                  <p className="text-sm font-medium leading-relaxed">{subData.videoScript}</p>
                </div>
                <div className="flex items-center justify-end gap-3 pt-2">
                  <button onClick={() => setActiveTab("quiz")} className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black shadow-xs cursor-pointer transition-transform hover:scale-105">
                    🎯 Passer au Quiz de cette leçon →
                  </button>
                </div>
              </div>
            )}

            {activeTab === "survival" && (
              <div className="anim-fade p-6 rounded-3xl bg-white border border-slate-200 shadow-sm space-y-4">
                <div className="flex items-center justify-between border-b pb-3">
                  <span className="text-xs font-black uppercase tracking-wider text-amber-600">⚡ Flash & Fiche de Survie 6ème</span>
                  <span className="text-xs font-bold px-2.5 py-0.5 rounded-lg bg-amber-100 text-amber-900">Mémo 2 minutes</span>
                </div>
                <h2 className="text-xl font-black text-slate-900">{subData.title}</h2>
                <div className="p-5 rounded-2xl bg-indigo-50 border border-indigo-200 text-indigo-950 font-bold text-sm leading-relaxed">
                  {subData.flash}
                </div>
                <div className="flex items-center justify-end gap-3 pt-2">
                  <button onClick={() => setActiveTab("quiz")} className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-black shadow-xs cursor-pointer">
                    S'entraîner sur cette notion →
                  </button>
                </div>
              </div>
            )}

            {activeTab === "quiz" && (
              <div className="anim-fade space-y-5">
                <div className="p-6 rounded-3xl bg-white border border-slate-200 shadow-sm space-y-4">
                  <div className="flex items-center justify-between border-b pb-3">
                    <span className="text-xs font-black uppercase text-emerald-600">🎯 Question {quizIndex + 1} • {subData.title}</span>
                    <span className="text-xs font-bold text-slate-500">Note : 20/20 visé</span>
                  </div>
                  <h3 className="text-base sm:text-lg font-black text-slate-900">{currentQ.q}</h3>
                  <div className="space-y-2">
                    {currentQ.options.map((opt, idx) => {
                      let btnStyle = "bg-slate-50 border-slate-200 text-slate-800 hover:bg-slate-100";
                      if (answered) {
                        if (idx === currentQ.rep) btnStyle = "bg-emerald-100 border-emerald-400 text-emerald-950 font-black";
                        else if (idx === selectedOption) btnStyle = "bg-rose-100 border-rose-300 text-rose-950 font-bold";
                      }
                      return (
                        <button key={idx} disabled={answered} onClick={() => handleAnswer(idx)} className={`w-full p-3.5 rounded-2xl text-left text-xs sm:text-sm font-semibold border-2 transition-all cursor-pointer flex items-center justify-between ${btnStyle}`}>
                          <span>{opt}</span>
                          {answered && idx === currentQ.rep && <span>✅</span>}
                        </button>
                      );
                    })}
                  </div>
                  {answered && (
                    <div className="flex items-center justify-between pt-2">
                      <span className="text-xs font-bold text-slate-600">
                        {selectedOption === currentQ.rep ? "🎉 Bravo, réponse exacte !" : "💡 Regarde la bonne réponse en vert ci-dessus."}
                      </span>
                      <button onClick={() => { setQuizIndex((i) => (i + 1) % subData.quiz.length); setAnswered(false); setSelectedOption(null); }} className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-black shadow-xs cursor-pointer">
                        Question suivante →
                      </button>
                    </div>
                  )}
                </div>

                <div className="p-6 rounded-3xl bg-white border border-slate-200 shadow-sm space-y-4">
                  <div className="flex items-center justify-between border-b pb-2">
                    <span className="text-xs font-black uppercase text-indigo-600">✍️ Entraînement Rédaction & Exemple Perso</span>
                    <span className="text-xs font-bold px-2 py-0.5 rounded-md bg-indigo-100 text-indigo-900">+100% des points</span>
                  </div>
                  <p className="text-xs font-bold text-slate-700">Consigne : Dis ton exemple personnel et justifie ta réponse en utilisant « car » ou « parce que ».</p>
                  <textarea value={userText} onChange={(e) => setUserText(e.target.value)} rows="3" placeholder="Écris ta phrase ici (Exemple : À la maison, je jette les canettes dans le bac jaune car l'aluminium est un métal recyclable)" className="w-full p-3.5 rounded-2xl border border-slate-300 text-xs sm:text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                  <div className="flex items-center justify-between flex-wrap gap-2">
                    <button onClick={handleValidateText} className="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs shadow-xs cursor-pointer">
                      Vérifier mon argumentation
                    </button>
                    {textFeedback && <span className="text-xs font-black text-slate-800">{textFeedback}</span>}
                  </div>
                </div>
              </div>
            )}

            {activeTab === "parent" && (
              <div className="anim-fade p-6 rounded-3xl bg-white border border-slate-200 shadow-sm space-y-5">
                <div className="flex items-center justify-between border-b pb-3">
                  <span className="text-xs font-black uppercase text-purple-600">🔒 Espace Parent & Bac à Sable</span>
                  <span className="text-xs font-bold px-2 py-0.5 rounded-md bg-purple-100 text-purple-900">Supervision</span>
                </div>
                <p className="text-xs text-slate-600 leading-relaxed">
                  Cet espace vous permet de vérifier le barème du collège 6ème (argumentation avec connecteurs, exemples personnels) et de simuler des scores sans modifier la progression réelle de Mathieu.
                </p>
                <div className="p-4 rounded-2xl bg-amber-50 border border-amber-300 text-xs text-amber-950 space-y-2">
                  <div className="font-black text-sm">🎯 Clé de réussite pour Mathieu en 6ème :</div>
                  <p>Ne pas laisser un mot isolé. Toujours reprendre les mots de la question et justifier avec « car » ou « parce que » pour obtenir 16 à 20/20.</p>
                </div>
              </div>
            )}
          </main>

          {isSommaireOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4 anim-fade">
              <div className="bg-white rounded-3xl p-6 max-w-lg w-full space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="text-base font-black text-slate-900">📚 Sommaire Complet des 7 Matières</h3>
                  <button onClick={() => setIsSommaireOpen(false)} className="text-slate-400 hover:text-slate-700 font-bold text-sm cursor-pointer">✕</button>
                </div>
                <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
                  {SUBJECTS.map((sub) => (
                    <button key={sub.id} onClick={() => { setCurrentSub(sub.id); setIsSommaireOpen(false); setActiveTab("video"); }} className="w-full p-3 rounded-2xl border border-slate-200 hover:border-indigo-400 text-left flex items-center justify-between transition-all cursor-pointer">
                      <div className="flex items-center gap-2">
                        <span className="text-xl">{sub.icon}</span>
                        <div>
                          <span className="font-extrabold text-xs block text-slate-900">{sub.name}</span>
                          <span className="text-[11px] text-slate-500">{LESSONS[sub.id].title}</span>
                        </div>
                      </div>
                      <span className="text-xs text-indigo-600 font-black">Accéder →</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {isPhotoOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4 anim-fade">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl text-center">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="text-base font-black text-slate-900 flex items-center gap-1.5">
                    <span>📸</span>
                    <span>Prendre en photo un cours ou devoir</span>
                  </h3>
                  <button onClick={() => setIsPhotoOpen(false)} className="text-slate-400 hover:text-slate-700 font-bold text-sm cursor-pointer">✕</button>
                </div>
                <p className="text-xs text-slate-600">Prends en photo la page de ton cahier ou ton devoir surveillé pour générer un entraînement sur-mesure !</p>
                <div className="p-8 border-2 border-dashed border-indigo-200 rounded-2xl bg-indigo-50/50 space-y-3">
                  <input ref={fileInputRef} type="file" accept="image/*" capture="environment" onChange={handlePhotoSimulate} className="hidden" />
                  {photoScanning ? (
                    <div className="py-4 space-y-2">
                      <div className="text-3xl animate-spin">⏳</div>
                      <p className="text-xs font-bold text-indigo-900">Analyse de la leçon en cours</p>
                    </div>
                  ) : (
                    <div>
                      <button onClick={() => fileInputRef.current?.click()} className="px-5 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-xs shadow-md cursor-pointer hover:bg-indigo-700">
                        Ouvrir la caméra ou importer une photo
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
